<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Sonara</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  <link href="sidepanel.css" rel="stylesheet"/>
</head>
<body class="antialiased">

  <main class="panel">

    <!-- BOOT / SESSION CHECK -->
    <div id="boot-view" class="view boot-view">
      <div class="boot-inner">
        <div class="boot-logo-wrap">
          <img class="boot-logo" src="logo.png" alt="Sonara" width="56" height="56"/>
        </div>
        <div class="loader-ring" aria-hidden="true"></div>
        <p class="boot-label">Loading</p>
      </div>
    </div>

    <!-- SIGN IN -->
    <div id="setup-view" class="view hidden">
      <header class="topbar">
        <div class="topbar-brand">
          <div class="topbar-logo-wrap">
            <img class="topbar-logo" src="logo.png" alt="" width="28" height="28"/>
          </div>
          <span class="topbar-name">Sonara</span>
        </div>
      </header>

      <div class="welcome-shell">
        <div class="welcome-block fade-in">
          <h1 class="welcome-title">Welcome to Sonara</h1>
          <p class="welcome-sub">Log in to capture tweets and sync them to your workspace.</p>

          <form id="login-form" class="setup-form" autocomplete="on">
            <label for="login-email">Email</label>
            <div class="input-wrap">
              <span class="material-symbols-outlined">mail</span>
              <input id="login-email" type="email" autocomplete="username" placeholder="you@company.com" required/>
            </div>

            <label for="login-password">Password</label>
            <div class="input-wrap">
              <span class="material-symbols-outlined">lock</span>
              <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" required/>
            </div>

            <button id="init-sync-btn" type="submit" class="btn-primary">
              <span id="sync-btn-spinner" class="btn-spinner hidden" aria-hidden="true"></span>
              <span id="sync-btn-text">Log in</span>
              <span id="sync-btn-icon" class="material-symbols-outlined">arrow_forward</span>
            </button>

            <div id="setup-feedback" class="feedback hidden" role="status"></div>

            <div class="auth-divider">
              <span>OR</span>
            </div>

            <button id="google-login-btn" type="button" class="btn-google">
              <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
              <span>Sign in with Google</span>
            </button>

            <p class="auth-alt">
              Don’t have an account?
              <button id="create-account-btn" type="button" class="text-link">Create account</button>
            </p>
          </form>
        </div>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-view" class="view hidden">
      <header class="topbar">
        <div class="topbar-brand">
          <div class="topbar-logo-wrap">
            <img class="topbar-logo" src="logo.png" alt="" width="28" height="28"/>
          </div>
          <span class="topbar-name">Sonara</span>
        </div>
        <div class="header-right">
          <button id="refresh-btn" class="icon-btn" title="Refresh" type="button">
            <span class="material-symbols-outlined">refresh</span>
          </button>
          <button id="settings-avatar-btn" class="avatar-btn" title="Account" type="button">
            <span class="material-symbols-outlined">account_circle</span>
          </button>
        </div>
      </header>

      <div class="scroll-area">
        <button id="capture-btn" class="btn-primary capture-btn" type="button">
          <span id="capture-spinner" class="btn-spinner hidden" aria-hidden="true"></span>
          <span class="material-symbols-outlined" id="capture-btn-icon">add</span>
          <span id="capture-btn-text">Add current tweet</span>
        </button>

        <section class="section">
          <div class="section-label">On this page</div>
          <div id="context-container" class="context-card">
            <div class="context-row">
              <div id="context-avatar" class="avatar">
                <span class="material-symbols-outlined">person</span>
              </div>
              <div class="context-meta">
                <div id="context-name" class="text-strong truncate">&mdash;</div>
                <div id="context-handle" class="text-dim truncate">@&mdash;</div>
              </div>
            </div>
            <p id="context-text" class="context-text">Open a tweet on X to preview it here.</p>
          </div>
        </section>

        <section class="section">
          <div class="section-header">
            <div class="section-label">Saved tweets</div>
            <span id="tweet-count" class="count-badge">0</span>
          </div>
          <div id="saved-tweets-list" class="tweet-list">
            <div class="tweet-skeleton" aria-hidden="true">
              <div class="skel skel-line short"></div>
              <div class="skel skel-line"></div>
              <div class="skel skel-line mid"></div>
            </div>
            <div class="tweet-skeleton" aria-hidden="true">
              <div class="skel skel-line short"></div>
              <div class="skel skel-line"></div>
              <div class="skel skel-line mid"></div>
            </div>
          </div>
        </section>
      </div>

      <footer class="panel-footer">
        <button id="open-command-center-btn" class="link-btn" type="button">
          <span class="material-symbols-outlined">open_in_new</span>
          <span>Open workspace</span>
        </button>
      </footer>
    </div>

    <!-- GLOBAL CAPTURE OVERLAY -->
    <div id="capture-overlay" class="capture-overlay hidden" aria-live="polite">
      <div class="capture-overlay-card">
        <div class="loader-ring large" aria-hidden="true"></div>
        <p id="capture-overlay-text">Adding tweet…</p>
      </div>
    </div>

    <!-- ACCOUNT MODAL -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal fade-in-up">
        <div class="modal-header">
          <h4>Account</h4>
          <button id="close-settings-btn" class="icon-btn" type="button">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="profile-card">
            <div id="modal-avatar" class="profile-avatar">
              <span class="material-symbols-outlined">person</span>
            </div>
            <div class="profile-meta">
              <div id="modal-identity" class="profile-name truncate">—</div>
              <div id="modal-email" class="profile-email truncate">—</div>
            </div>
          </div>
          <button id="see-more-btn" class="link-btn see-more-btn" type="button">
            <span>See more</span>
            <span class="material-symbols-outlined">arrow_forward</span>
          </button>
          <button id="disconnect-key-btn" class="btn-danger" type="button">
            <span class="material-symbols-outlined">logout</span>
            <span>Sign out</span>
          </button>
        </div>
      </div>
    </div>

  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
